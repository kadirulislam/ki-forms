name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (src + tests)
        run: npm run typecheck

      - name: Test (compat + features)
        run: npm test

      - name: Build library
        run: npm run build

      - name: Smoke-test the CLI bin
        run: |
          set -euo pipefail
          test -f dist/cli.js
          head -n 1 dist/cli.js | grep -q '^#!'
          node dist/cli.js --version
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/src"
          cd "$tmp"
          node "$GITHUB_WORKSPACE/dist/cli.js" add "waitlist form" > /dev/null
          test -f src/forms/WaitlistForm.tsx
          test -f src/forms/waitlist-form.schema.json
          node "$GITHUB_WORKSPACE/dist/cli.js" validate src/forms/waitlist-form.schema.json
          # The scaffolded schema must round-trip to byte-identical code.
          node "$GITHUB_WORKSPACE/dist/cli.js" export src/forms/waitlist-form.schema.json \
            --component WaitlistForm --out again.tsx
          diff src/forms/WaitlistForm.tsx again.tsx
          # A share link must be produced for the scaffolded schema.
          node "$GITHUB_WORKSPACE/dist/cli.js" share src/forms/waitlist-form.schema.json \
            --origin https://example.com --out link.txt
          grep -q '#ki=v1\.' link.txt

      - name: Smoke-test the MCP server
        run: |
          set -euo pipefail
          test -f dist/mcp.js
          head -n 1 dist/mcp.js | grep -q '^#!'
          node scripts/mcp-smoke.mjs dist/mcp.js

      - name: Build docs
        run: npm run docs:build

      - name: Build studio
        run: npm run studio:build

  deploy-demo:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build docs + studio (self-contained HTML)
        run: npm run pages:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
